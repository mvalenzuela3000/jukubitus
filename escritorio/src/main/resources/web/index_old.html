<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
      name="viewport"
    />
    <meta name="viewport" content="width=device-width" />

    <title>Jacobitus</title>
    <link rel="icon" href="assets/images/favicon.ico" />

    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/all.min.css" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #ffffff;
      }

      body {
        overflow: hidden;
      }

      .navbar a {
        opacity: 0.7;
      }

      .navbar a:hover {
        opacity: 1;
      }

      .navbar .navbar-brand {
        opacity: 1 !important;
      }

      /*
    * CONTENEDOR PRINCIPAL
    * El fondo general es blanco.
    * La imagen ocupa todo el alto conservando su proporción.
    */
      .main {
        position: fixed;
        top: 0;
        left: 0;

        width: 100vw;
        height: 100vh;

        background-color: #ffffff;
        background-image: url("assets/images/jukumari.jpeg");
        background-repeat: no-repeat;
        background-position: center center;

        /*
        * 100% de alto.
        * El ancho se calcula automáticamente.
        * No deforma ni recorta la imagen.
        */
        background-size: auto 100%;

        overflow: hidden;
      }

      /*
    * CAPA OSCURA
    *
    * IMPORTANTE:
    * Si ponemos width:100%, también oscurecería
    * los laterales blancos.
    *
    * inherit permite utilizar exactamente la misma
    * imagen y tamaño que .main.
    */
      .cover {
        position: absolute;
        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        /*
        * Oscurecimiento de la pantalla.
        */
        background-color: rgba(0, 0, 0, 0.6);

        z-index: 1;
      }

      .main .titulo {
        color: #ffffff;
        font-size: 56px;
        font-weight: 300;
        position: relative;
        text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);
        margin-top: 150px;
        z-index: 3;
      }

      .content {
        position: relative;
        color: #ffffff;

        text-shadow:
          0 1px 4px rgba(0, 0, 0, 0.33),
          0 0 10px rgba(0, 0, 0, 0.25);

        z-index: 4;
      }

      .footer {
        position: fixed;
        bottom: 20px;
        right: 0;

        width: 100%;

        z-index: 4;
        margin-top: 50px;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <nav
            class="navbar fixed-top navbar-expand-lg navbar-dark p-md-3 navscroll"
          >
            <div class="container">
              <a class="navbar-brand" href="#">
                <img width="35" src="assets/images/favicon.ico" />
              </a>
              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a
                      class="nav-link text-white"
                      href="https://validar.firmadigital.bo"
                      target="_blank"
                    >
                      <i class="fa fa-check"></i> Validador de documentos</a
                    >
                  </li>
                </ul>
                <div class="mx-auto"></div>
              </div>
            </div>
          </nav>
          <div class="main">
            <div class="background-image"></div>
            <div class="container content">
              <h1
                class="text-center display-3"
                style="
                  text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);
                  margin-top: 150px;
                "
              >
                Jukubitus 2.0.0
              </h1>
              <h5
                class="text-center text-white"
                style="text-shadow: 0 0 10px rgba(0, 0, 0, 0.33)"
              >
                VERSIÓN DE ESCRITORIO
              </h5>
              <span
                class="d-block lead fs-1 text-center text-white mt-5"
                style="text-shadow: 0 0 10px rgba(0, 0, 0, 0.33)"
                >Solución a todo requerimiento de firma digital</span
              >
            </div>
            <div class="footer text-center">
              <div class="container">
                <a href="https://www.ait.gob.bo" target="_blank"
                  ><img width="250" src="assets/images/logo-ait-blanco.png"
                /></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="assets/js/bootstrap.bundle.min.js"></script>
</html>
