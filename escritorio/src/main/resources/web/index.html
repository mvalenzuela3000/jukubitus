<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
  <meta name="viewport" content="width=device-width" />

  <title>Jukubitus</title>
  <link rel="icon" href="assets/images/favicon.ico"/>

  <link href="assets/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/all.min.css"/>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      overflow: hidden;
    }

    .navbar {
      z-index: 10;
    }

    .navbar a {
      opacity: 0.7;
    }

    .navbar a:hover {
      opacity: 1;
    }

    .navbar .navbar-brand {
      opacity: 1 !important;
    }

    /*
     * Contenedor principal:
     * ocupa toda la pantalla y deja fondo blanco
     * en los laterales que no sean cubiertos por la imagen.
     */
    .main {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
    }

    /*
     * Contenedor de la imagen.
     * Se centra horizontalmente y ocupa todo el alto.
     */
    .jukumari-background {
      position: absolute;
      top: 0;
      left: 50%;
      height: 100vh;
      transform: translateX(-50%);
      z-index: 0;
    }

    /*
     * Imagen a todo el alto conservando proporción.
     * El ancho se ajusta automáticamente.
     */
    .jukumari-background > img {
      display: block;
      width: auto;
      height: 100vh;
      max-width: none;
      object-fit: contain;
    }

    /*
     * Sombreado sobre TODA la pantalla:
     * cubre tanto la imagen como los espacios laterales.
     */
    .cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.60);
      z-index: 1;
      pointer-events: none;
    }

    .main .titulo {
      color: #FFFFFF;
      font-size: 56px;
      font-weight: 300;
      position: relative;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);
      margin-top: 150px;
      z-index: 3;
    }

    .content {
      position: relative;
      color: #FFFFFF;
      text-shadow:
        0 1px 4px rgba(0, 0, 0, 0.33),
        0 0 10px rgba(0, 0, 0, 0.25);
      z-index: 4;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 0;
      width: 100%;
      z-index: 4;
    }

    /*
     * Mejor comportamiento en pantallas pequeñas.
     */
    @media (max-width: 768px) {
      .content h1 {
        margin-top: 120px !important;
        font-size: 2.5rem;
      }

      .content .lead {
        font-size: 1.25rem !important;
        padding-left: 15px;
        padding-right: 15px;
      }

      .footer img {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="container-fluid p-0">
    <div class="row g-0">
      <div class="col-md-12">

        <nav class="navbar fixed-top navbar-expand-lg navbar-dark p-md-3 navscroll">
          <div class="container">

            <a class="navbar-brand" href="#">
              <img width="35" src="assets/images/favicon.ico" alt="Jukubitus" />
            </a>

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation">

              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

              <ul class="navbar-nav">
                <li class="nav-item">
                  <a
                    class="nav-link text-white"
                    href="https://validar.firmadigital.bo"
                    target="_blank"
                    rel="noopener noreferrer">

                    <i class="fa fa-check"></i>
                    Validador de documentos externo
                  </a>
                </li>
                <li class="nav-item">
                  <a
                    class="nav-link text-white"
                    href="https://servicios.ait.gob.bo:9000/apidoc"
                    target="_blank"
                    rel="noopener noreferrer">

                    <i class="fa fa-check"></i>
                    Documentación
                  </a>
                </li>
              </ul>

              <div class="mx-auto"></div>

            </div>
          </div>
        </nav>


        <div class="main">

          <!--
            La imagen se mantiene al 100% del alto.
            El espacio lateral sobrante queda blanco.
          -->
          <div class="jukumari-background">
            <img src="assets/images/jukumari.png" alt="Jukumari" />
          </div>

          <!-- Sombreado sobre toda la pantalla, incluidos los laterales -->
          <div class="cover"></div>

          <div class="container content">

            <h1
              class="text-center display-3"
              style="
                text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);
                margin-top: 250px;
              ">
              Jukubitus 1.0.0
            </h1>

            <h5
              class="text-center text-white"
              style="text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);">
              VERSIÓN DE ESCRITORIO
            </h5>

            <span
              class="d-block lead fs-1 text-center text-white mt-5"
              style="text-shadow: 0 0 10px rgba(0, 0, 0, 0.33);">

              Solución a todo requerimiento de firma digital
            </span>

          </div>


          <div class="footer text-center">
            <div class="container">

              <a
                href="https://www.ait.gob.bo"
                target="_blank"
                rel="noopener noreferrer">

                <img
                  width="250"
                  src="assets/images/logo-ait-blanco.png"
                  alt="Autoridad de Impugnación Tributaria" />
              </a>

            </div>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="assets/js/bootstrap.bundle.min.js"></script>

</body>

</html>
