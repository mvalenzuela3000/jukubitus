    group 'distribution'
    
    dependsOn clean
    dependsOn ':jacobitus-libreria:buildForWindows'
    dependsOn importCA
    dependsOn addDriversWindows
    dependsOn importChangePinWindows
    dependsOn shadowJar

    project(':jacobitus-libreria').tasks.findByName('buildForWindows').mustRunAfter 'clean'
    tasks.findByName('importCA').mustRunAfter 'clean'
    tasks.findByName('addDriversWindows').mustRunAfter 'clean', ':jacobitus-libreria:buildForWindows'
    tasks.findByName('importChangePinWindows').mustRunAfter 'clean', ':jacobitus-libreria:buildForWindows'
    tasks.findByName('shadowJar').mustRunAfter ':jacobitus-libreria:buildForWindows', 'importChangePinWindows', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'msi',
        '--icon', './iconos/icon.ico',
        '--win-shortcut',
        '--win-menu',
        '--win-menu-group', "AGETIC"
    ])
}
