    group 'distribution'

    // dependsOn clean
    // dependsOn ':jacobitus-libreria:buildForFedora'
    // dependsOn importCA
    // dependsOn importChangePinFedora
    // dependsOn jar

    // project(':jacobitus-libreria').tasks.findByName('buildForFedora').mustRunAfter 'clean'
