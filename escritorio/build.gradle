plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'org.openjfx.javafxplugin' version '0.0.10'
    id 'bo.firmadigital.jacobitus4.java-conventions'
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
       dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(path: ':jacobitus-libreria', configuration: 'shadow')

    implementation 'org.openjfx:javafx-controls:15.0.1'
    implementation 'org.openjfx:javafx-swing:15.0.1'
    
    implementation 'org.eclipse.jetty:jetty-server:10.0.21'
    implementation 'org.eclipse.jetty:jetty-servlet:10.0.21'
    implementation 'org.eclipse.jetty:jetty-servlets:10.0.21'
    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-servlet:2.43'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:2.43'
    
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'com.itextpdf:sign:7.1.15'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.1.2'
    implementation 'org.codehaus.jettison:jettison:1.5.1'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'org.apache.santuario:xmlsec:2.3.1'

    implementation 'com.digitalpersona.onetouch:dpotapi:1.0'
    implementation 'com.digitalpersona.onetouch:dpotjni:1.0'
    implementation 'fr.opensagres.xdocreport:org.odftoolkit.odfdom.converter.pdf:1.0.6'
    implementation 'fr.opensagres.xdocreport:org.apache.poi.xwpf.converter.pdf:1.0.6'
    
    compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'junit:junit:4.13.2'
}

group = 'bo.firmadigital.jacobitus4'
version = '1.3.4'
description = 'Jacobitus4'
mainClassName = 'bo.firmadigital.jacobitus4.Main'

def appName = 'Jacobitus Escritorio'
def jarName = "jacobitus-escritorio"

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

// test {
//    testLogging {
//        events "failed", "passed", "skipped", "standardError", "standardOut", "started"
//    }
// }

javafx {
    version = '15.0.1'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.base']
}

jar {
    archiveBaseName = jarName
    archiveVersion = version
    manifest {
        attributes(
            'Main-Class': 'bo.firmadigital.jacobitus4.Main',
        )
    }
}

shadowJar {
    archiveBaseName = jarName
    archiveVersion = version
    archiveClassifier = ''
    mergeServiceFiles()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += '-Dfile.encoding=UTF-8'
}

tasks.register('importCA', Copy) {
    from layout.projectDirectory.dir("ca")
    into layout.projectDirectory.dir("build/libs/ca")
}

tasks.register('addDriversLinux', Copy) {
    group 'build'
    from layout.projectDirectory.file('controladores/linux')
    into layout.projectDirectory.dir('build/libs/controladores')
}

tasks.register('addDriversMacOS', Copy) {
    group 'build'
    from layout.projectDirectory.file('controladores/macos')
    into layout.projectDirectory.dir('build/libs/controladores')
}

tasks.register('addDriversWindows', Copy) {
    group 'build'
    from layout.projectDirectory.file('controladores/windows')
    into layout.projectDirectory.dir('build/libs/controladores')
}

tasks.register('importChangePinLinux', Copy) {
    group 'build'
    from project(':jacobitus-libreria').file("build/libs/libchangepin.so")
    into layout.projectDirectory.dir("build/libs")
}

tasks.register('importChangePinMacOS', Copy) {
    group 'build'
    from project(':jacobitus-libreria').file("build/libs/libchangepin.dylib")
    into layout.projectDirectory.dir("build/libs")
}

tasks.register('importChangePinWindows', Copy) {
    group 'build'
    from project(':jacobitus-libreria').file("build/libs/changepin.dll")
    into layout.projectDirectory.dir("build/libs")
}

def jpackageCommand = [
    System.getProperty("java.home") + '/bin/jpackage',
    '--verbose',
    '--input', './build/libs/',
    '--main-class', mainClassName,
    '--main-jar', jarName + '-' + version + ".jar",
    //'--arguments', 'arg1',
    '--vendor', 'AGETIC',
    '--dest', 'dist',
    '--name', appName,
    '--app-version', version.replace('-1', ''),
    '--description', appName,
    '--file-associations', 'FAjws.properties',
    '--file-associations', 'FAp7s.properties',
    '--file-associations', 'FApdf.properties',
    '--java-options', '-Dfile.encoding=UTF-8',
    '--license-file', 'license.txt',
    //'--temp', 'tmp'
]

tasks.register('packageDeb', Exec) {
    group 'distribution'

    dependsOn clean
    dependsOn ':jacobitus-libreria:buildForLinux'
    dependsOn importCA
    dependsOn addDriversLinux
    dependsOn importChangePinLinux
    dependsOn shadowJar

    project(':jacobitus-libreria').tasks.findByName('buildForLinux').mustRunAfter 'clean'
    tasks.findByName('importCA').mustRunAfter 'clean'
    tasks.findByName('addDriversLinux').mustRunAfter 'clean', ':jacobitus-libreria:buildForLinux'
    tasks.findByName('importChangePinLinux').mustRunAfter 'clean', ':jacobitus-libreria:buildForLinux'
    tasks.findByName('shadowJar').mustRunAfter ':jacobitus-libreria:buildForLinux', 'importChangePinLinux', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'deb',
        '--icon', './iconos/icon.png',
        '--linux-package-name', 'jacobitus-total',
        '--linux-deb-maintainer', 'desarrollo@firmadigital.bo',
        '--linux-package-deps', 'libnss3-tools, pcscd, pcsc-tools, libnss3, libpcsclite1',
        '--linux-shortcut'
    ])
}

