/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.10'
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
       dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':libreria')
    implementation 'org.openjfx:javafx-controls:15.0.1'
    implementation 'org.openjfx:javafx-swing:15.0.1'
    implementation 'org.eclipse.jetty:jetty-server:9.4.34.v20201102'
    implementation 'org.eclipse.jetty:jetty-servlet:9.4.34.v20201102'
    implementation 'org.eclipse.jetty:jetty-servlets:9.4.34.v20201102'
    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-servlet:2.41'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:2.32'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.68'
    implementation 'com.itextpdf:sign:7.1.15'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.1.2'
    implementation 'org.codehaus.jettison:jettison:1.5.1'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'org.apache.santuario:xmlsec:2.3.1'
    implementation 'com.digitalpersona.onetouch:dpotapi:1.0'
    implementation 'com.digitalpersona.onetouch:dpotjni:1.0'
    testImplementation 'junit:junit:4.13.2'
}

group = 'bo.firmadigital'
version = '1.2.0'
description = 'Jacobitus4'
mainClassName = 'bo.firmadigital.jacobitus4.Main'

def appName = 'Jacobitus Total'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

javafx {
    version = '15.0.1'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.base']
}

jar {
    archiveName = rootProject.name + '.jar'
    manifest {
        attributes(
            'Main-Class': 'bo.firmadigital.jacobitus4.Main'
        )
    }
    tasks.withType(Jar){
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}

tasks.register('importCA', Copy) {
    from layout.projectDirectory.dir("ca")
    into layout.projectDirectory.dir("build/libs/ca")
}

tasks.register('importChangePinDebian', Copy) {
    group 'build'
    from layout.projectDirectory.file("libreria/build/libs/libchangepin.so")
    into layout.projectDirectory.dir("build/libs")
}

tasks.register('importChangePinMacOS', Copy) {
    group 'build'
    from layout.projectDirectory.file("libreria/build/libs/libchangepin.dylib")
    into layout.projectDirectory.dir("build/libs")
}

tasks.register('importChangePinWindows', Copy) {
    group 'build'
    from layout.projectDirectory.file("libreria/build/libs/changepin.dll")
    into layout.projectDirectory.dir("build/libs")
}

def jpackageCommand = [
    System.getProperty("java.home") + '/bin/jpackage',
    '--verbose',
    '--input', './build/libs/',
    '--main-class', mainClassName,
    '--main-jar', "jacobitus4.jar",
    //'--arguments', 'arg1',
    '--vendor', 'ADSIB',
    '--dest', 'dist',
    '--name', appName,
    '--app-version', version.replace('-1', ''),
    '--description', appName,
    '--file-associations', 'FApdf.properties',
    '--license-file', 'license.txt',
    //'--temp', 'tmp'
]

tasks.register('packageDeb', Exec) {
    group 'distribution'

    dependsOn clean
    dependsOn ':libreria:buildForDebian'
    dependsOn importCA
    dependsOn importChangePinDebian
    dependsOn jar

    project(':libreria').tasks.findByName('buildForDebian').mustRunAfter 'clean'
    tasks.findByName('importCA').mustRunAfter 'clean'
    tasks.findByName('importChangePinDebian').mustRunAfter 'clean', ':libreria:buildForDebian'
    tasks.findByName('jar').mustRunAfter ':libreria:buildForDebian', 'importChangePinDebian', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'deb',
        '--icon', './iconos/icon.png',
        '--linux-package-name', 'jacobitus-total',
        '--linux-deb-maintainer', 'adsib@firmadigital.bo',
        '--linux-package-deps', 'libnss3-tools, pcscd, pcsc-tools',
        '--linux-shortcut'
    ])
}

tasks.register('packageRpm', Exec) {
    group 'distribution'

    // dependsOn clean
    // dependsOn ':libreria:buildForFedora'
    // dependsOn importCA
    // dependsOn importChangePinFedora
    // dependsOn jar

    // project(':libreria').tasks.findByName('buildForFedora').mustRunAfter 'clean'
    // tasks.findByName('importCA').mustRunAfter 'clean'
    // tasks.findByName('importChangePinFedora').mustRunAfter 'clean', ':libreria:buildForFedora'
    // tasks.findByName('jar').mustRunAfter ':libreria:buildForFedora', 'importChangePinFedora', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'rpm',
        '--icon', './iconos/icon.png'
    ])
}

tasks.register('packageDmg', Exec) {
    group 'distribution'

    dependsOn clean
    dependsOn ':libreria:buildForMacOS'
    dependsOn importCA
    dependsOn importChangePinMacOS
    dependsOn jar

    project(':libreria').tasks.findByName('buildForMacOS').mustRunAfter 'clean'
    tasks.findByName('importCA').mustRunAfter 'clean'
    tasks.findByName('importChangePinMacOS').mustRunAfter 'clean', ':libreria:buildForMacOS'
    tasks.findByName('jar').mustRunAfter ':libreria:buildForMacOS', 'importChangePinMacOS', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'dmg',
        '--icon', './iconos/icon.icns'
    ])
}

tasks.register('packageMsi', Exec) {
    group 'distribution'
    
    dependsOn clean
    dependsOn ':libreria:buildForWindows'
    dependsOn importCA
    dependsOn importChangePinWindows
    dependsOn jar

    project(':libreria').tasks.findByName('buildForWindows').mustRunAfter 'clean'
    tasks.findByName('importCA').mustRunAfter 'clean'
    tasks.findByName('importChangePinWindows').mustRunAfter 'clean', ':libreria:buildForWindows'
    tasks.findByName('jar').mustRunAfter ':libreria:buildForWindows', 'importChangePinWindows', 'importCA'

    workingDir './'
    commandLine(jpackageCommand + [
        '--type', 'msi',
        '--icon', './iconos/icon.ico',
        '--win-shortcut',
        '--win-menu',
        '--win-menu-group', "ADSIB"
    ])
}
