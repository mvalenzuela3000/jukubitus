/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.10'
}

repositories {
    mavenLocal()
    mavenCentral()
    flatDir {
       dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':libreria')
    implementation 'org.openjfx:javafx-controls:15.0.1'
    implementation 'org.openjfx:javafx-swing:15.0.1'
    implementation 'org.eclipse.jetty:jetty-server:9.4.34.v20201102'
    implementation 'org.eclipse.jetty:jetty-servlet:9.4.34.v20201102'
    implementation 'org.eclipse.jetty:jetty-servlets:9.4.34.v20201102'
    implementation 'org.glassfish.jersey.containers:jersey-container-jetty-servlet:2.32'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:2.32'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.68'
    implementation 'com.itextpdf:sign:7.1.15'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.1.2'
    implementation 'org.codehaus.jettison:jettison:1.5.1'
    implementation 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
    implementation 'org.apache.santuario:xmlsec:2.3.1'
    implementation 'com.digitalpersona.onetouch:dpotapi:1.0'
    implementation 'com.digitalpersona.onetouch:dpotjni:1.0'
    testImplementation 'junit:junit:4.13.2'
}

group = 'bo.firmadigital'
version = '1.1.0-SNAPSHOT'
description = 'Jacobitus4'
mainClassName = 'bo.firmadigital.jacobitus4.Main'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

javafx {
    version = '15.0.1'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing', 'javafx.base']
}

jar {
    archiveName = rootProject.name + '.jar'
    manifest {
        attributes(
            'Main-Class': 'bo.firmadigital.jacobitus4.Main'
        )
    }
    tasks.withType(Jar){
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    from(configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }) {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
